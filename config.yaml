llm:
  base_url: "http://localhost:11434/v1"
  model: "qwen3:8b"
  system_prompt: "You are a helpful voice assistant. Keep responses concise and conversational."

stt:
  model_size: "base.en"
  device: "auto"  # auto, cpu, or cuda
  compute_type: "int8"

tts:
  # Available voices:
  #   af_sky      - higher-pitched American female
  #   af_heart    - warm mid-range American female
  #   af_bella    - energetic American female
  #   af_sarah    - American female
  #   bf_emma     - British female
  #   bf_isabella - British female
  #   am_adam     - American male
  #   am_michael  - American male
  #   bm_george   - British male
  #   bm_lewis    - British male
  voice: "af_sky"
  speed: 1.2            # 1.0 = normal, 1.2 = 20% faster
  pitch_semitones: 0    # semitones up (+) or down (-); 0 = no shift
  sample_rate: 24000

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024

vad:
  threshold: 0.5
  min_speech_duration_ms: 250
  min_silence_duration_ms: 600

server:
  # Set a non-empty string to require clients to authenticate with {"token": "<secret_key>"}
  # Also set NEXT_PUBLIC_WS_TOKEN in the web UI to the same value.
  secret_key: ""

n8n:
  base_url: "http://localhost:5678"
  webhooks:
    control_smart_home: /webhook/smart-home
    query_calendar: /webhook/calendar
    send_message: /webhook/send-message
    add_to_list: /webhook/shopping-list
    web_search: /webhook/web-search
    set_reminder: /webhook/set-reminder
  timeout: 10
