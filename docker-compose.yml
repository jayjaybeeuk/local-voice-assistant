services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  voice-assistant:
    build: .
    container_name: voice-assistant
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://n8n:5678}
    ports:
      - "8765:8765"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./persona.md:/app/persona.md
      - ./memory.md:/app/memory.md
      - models_cache:/app/models
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8765}
        NEXT_PUBLIC_WS_TOKEN: ${NEXT_PUBLIC_WS_TOKEN:-}
    container_name: voice-assistant-web
    ports:
      - "3002:3000"
    depends_on:
      - voice-assistant
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    profiles:
      - tools
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  ollama_data:
  models_cache:
  n8n_data:
