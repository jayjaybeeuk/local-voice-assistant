services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  voice-assistant:
    build: .
    container_name: voice-assistant
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./models:/app/models
    devices:
      - /dev/snd:/dev/snd
    network_mode: host
    restart: unless-stopped

volumes:
  ollama_data:
